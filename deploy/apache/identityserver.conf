# Apache 2.4 with ssl, proxy, proxy_http, headers, alias and auth_gssapi modules.
# Adapt certificate/keytab paths and hostname, and install the secret include before configtest.
<VirtualHost *:443>
    ServerName identity.example.com
    SSLEngine on
    SSLCertificateFile /etc/ssl/identity.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/identity.example.com/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    # Replace client-supplied forwarding/identity headers before proxying.
    RequestHeader set Host "identity.example.com"
    RequestHeader set X-Forwarded-Host "identity.example.com"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader unset X-Forwarded-Prefix
    RequestHeader unset X-IdentityServer-User
    RequestHeader unset X-IdentityServer-Proxy-Secret
    Include /etc/identityserver/proxy-secret.apache.conf

    RedirectMatch 308 "^/IdentityServer$" "/IdentityServer/"
    # Preserve the prefix on the backend. PathBase is split by IdentityServer.
    ProxyPass        "/IdentityServer/" "http://127.0.0.1:5080/IdentityServer/"
    ProxyPassReverse "/IdentityServer/" "http://127.0.0.1:5080/IdentityServer/"

    <LocationMatch "^/IdentityServer/connect/authorize$">
        AuthType GSSAPI
        AuthName "IdentityServer"
        GssapiCredStore keytab:/etc/apache2/identityserver.http.keytab
        GssapiAllowedMech krb5
        GssapiLocalName Off
        GssapiBasicAuth Off
        GssapiSSLonly On
        GssapiUseSessions Off
        Require valid-user
        RequestHeader set X-IdentityServer-User "expr=%{REMOTE_USER}"
        RequestHeader unset Authorization
    </LocationMatch>
    # Discovery, JWKS and token requests have no GSSAPI requirement and no identity header.
    # Add explicit authenticated locations for any protected routes in an embedded host.
</VirtualHost>
