# Requires the SPNEGO module (e.g. libnginx-mod-http-auth-spnego) to be installed/loaded.
# Adapt certificate paths and hostname. Included files must exist before nginx -t.
server {
    listen 443 ssl;
    server_name identity.example.com;
    ssl_certificate /etc/ssl/identity.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/identity.example.com/privkey.pem;

    location = /IdentityServer {
        return 308 /IdentityServer/;
    }

    # Only browser authorization requires Kerberos. Discovery, JWKS and code redemption
    # must stay reachable without a browser/user credential exchange.
    location = /IdentityServer/connect/authorize {
        auth_gss on;
        auth_gss_keytab /etc/nginx/identityserver.http.keytab;
        auth_gss_service_name HTTP/identity.example.com;
        # Match Directory:Realm, especially when the host's default realm differs.
        auth_gss_realm EXAMPLE.COM;
        auth_gss_format_full on;
        auth_gss_allow_basic_fallback off;

        include /etc/nginx/snippets/identityserver-proxy.conf;
        proxy_set_header X-IdentityServer-User $remote_user;
        # The SPNEGO module may synthesize a Basic header. Do not forward it.
        proxy_set_header Authorization "";
        # No trailing URI here: preserve /IdentityServer for the application's PathBase.
        proxy_pass http://127.0.0.1:5080;
    }

    location /IdentityServer/ {
        include /etc/nginx/snippets/identityserver-proxy.conf;
        # Never forward an identity supplied by an unauthenticated client.
        proxy_set_header X-IdentityServer-User "";
        # Preserve Authorization here: token clients may use HTTP Basic client authentication.
        proxy_pass http://127.0.0.1:5080;
    }

    location / { return 404; }
}
