proxy_http_version 1.1;
# Authorization-code redirects carry an encrypted code in the Location header.
# The default 4K/8K response-header buffer can be too small even for modest profiles.
proxy_buffer_size 16k;
proxy_buffers 4 16k;
proxy_set_header Connection "";
proxy_set_header Host identity.example.com;
proxy_set_header X-Forwarded-Host identity.example.com;
proxy_set_header X-Forwarded-Proto https;
# Overwrite client values; this example has exactly one front proxy.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Prefix "";
include /etc/identityserver/proxy-secret.nginx.conf;
