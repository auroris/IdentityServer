proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host identity.example.com;
proxy_set_header X-Forwarded-Host identity.example.com;
proxy_set_header X-Forwarded-Proto https;
# Overwrite client values; this example has exactly one front proxy.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Prefix "";
include /etc/identityserver/proxy-secret.nginx.conf;
