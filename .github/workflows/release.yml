name: Release

run-name: Release ${{ inputs.version || format('(next {0})', inputs.bump) }}${{ inputs.dry-run && ' (dry run)' || '' }}

# Publishes the self-contained Windows and Linux archives and the three NuGet packages to GitHub, and the packages to
# nuget.org. Starts by hand, or from the CI workflow when a Dependabot update of a shipped package has passed the tests.
# The shared steps come from auroris/AurorisNet.Build, whose docs/releasing.md describes them. nuget.org trusts this file
# by its name, so keep it release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 1.2.3 or 1.2.3-rc.1. Leave empty to raise the newest release tag.
        required: false
        type: string
      bump:
        description: Which part of the newest stable tag to raise when the version is empty
        type: choice
        default: patch
        options:
          - patch
          - minor
      test:
        description: Run the tests before publishing. The automated runs turn this off, because they have just run them.
        type: boolean
        default: true
      dry-run:
        description: Test, build and pack only, and keep the archives and packages as an artifact
        type: boolean
        default: false
      notes:
        description: Notes for the GitHub release, in Markdown, shown above the generated list of changes
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  version:
    name: Choose the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Choose the version
        id: version
        uses: auroris/AurorisNet.Build/actions/version@main
        with:
          version: ${{ inputs.version }}
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}

  # The server reads the directory through different libraries on each system, so each archive is tested and built on
  # its own system. Tests that need a live directory run on a developer's machine.
  build:
    name: Test and build (${{ matrix.runtime }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Test
        if: ${{ inputs.test }}
        run: dotnet test IdentityServer.sln --configuration Release --filter 'Category!=LiveDirectory'

      - name: Publish the self-contained application
        run: >-
          dotnet publish IdentityServer.csproj
          --configuration Release
          --runtime "$env:RELEASE_RUNTIME"
          --self-contained true
          --output artifacts/publish
          -p:Version="$env:RELEASE_VERSION"
          -p:ContinuousIntegrationBuild=true

      - name: Include the documentation and deployment templates
        run: |
          Copy-Item -Path README.md, LICENSE -Destination artifacts/publish
          Copy-Item -Path docs, deploy -Destination artifacts/publish -Recurse

      - name: Archive for Windows
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path artifacts/archives -Force | Out-Null
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/archives/IdentityServer-$env:RELEASE_VERSION-$env:RELEASE_RUNTIME.zip"

      # tar keeps the executable permission, which a zip archive would drop.
      - name: Archive for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts/archives
          chmod +x artifacts/publish/IdentityServer
          tar -czf "artifacts/archives/IdentityServer-${RELEASE_VERSION}-${RELEASE_RUNTIME}.tar.gz" -C artifacts/publish .

      - name: Pass the archive to the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.runtime }}
          path: artifacts/archives/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Pack and publish
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # AurorisNet.IdentityServer and AurorisNet.IdentityServer.Directory depend on AurorisNet.ActiveDirectory at this
      # version, so the three are packed and published together.
      - name: Pack
        run: |
          foreach ($project in 'ActiveDirectory/ActiveDirectory.csproj', 'IdentityServer.Core/IdentityServer.Core.csproj', 'IdentityServer.Directory/IdentityServer.Directory.csproj') {
            dotnet pack $project --configuration Release --output artifacts/packages "-p:Version=$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Could not pack $project." }
          }

      - name: Fetch the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: artifacts/archives
          merge-multiple: true

      - name: Write the checksums
        shell: bash
        run: |
          cp artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/archives/
          cd artifacts/archives
          test -s "IdentityServer-${RELEASE_VERSION}-win-x64.zip"
          test -s "IdentityServer-${RELEASE_VERSION}-linux-x64.tar.gz"
          sha256sum IdentityServer-* *.nupkg *.snupkg > SHA256SUMS.txt
          rm *.nupkg *.snupkg
          cat SHA256SUMS.txt

      - name: Publish
        uses: auroris/AurorisNet.Build/actions/publish@main
        with:
          versions: ${{ needs.version.outputs.version }}
          assets: |
            artifacts/archives/IdentityServer-*
            artifacts/archives/SHA256SUMS.txt
          dry-run: ${{ inputs.dry-run }}
          notes: ${{ inputs.notes }}
